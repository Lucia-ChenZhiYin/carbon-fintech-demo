   * 當你在 `index.html` 填寫不同公司、發票號碼與金額並上傳檔案時，`app.py` 會**實時**寫入 SQLite 資料庫 (`database.db`)。

### 💡 你需要製作模擬資料嗎？

**是的，強烈建議製作！** 在金融科技競賽或報告展示中，一個剛初始化的空白資料庫會讓 Demo 看起來很單薄。預先注入 **3 ~ 5 筆合理的歷史交易資料**，能達到以下效果：

1. **直接點擊「歷史上傳紀錄」即可展示清單**：不需每次報告都重新手動輸入好幾次。
2. **展現動態演算法差異**：準備不同金額（例如 200 萬 vs 800 萬）與不同企業的單據，展示 TSS 分數與優惠利率（-0.15% vs -0.35%）的動態變化。
3. **展示跨行防重複融資驗證**：預先注入一筆特定 Hash，展示再次上傳相同單據時的驗證邏輯。

### 🚀 助教幫你直接封裝「自動模擬資料注入」

不需要手動去打 SQL 或建 CSV。我們只需在 `app.py` 的 `init_db()` 中加入**自動種子資料（Seed Data）機制**：只要資料庫是空的，啟動時就會自動幫你寫入 3 筆逼真的鋼鐵與營造業綠色採購歷史單據！

請將 `app.py` 中的 `init_db()` 替換為以下程式碼：

```python
# 1. 初始化 SQLite 資料庫（含 Demo 預設模擬數據）
def init_db():
    conn = sqlite3.connect('database.db')
    cursor = conn.cursor()
    cursor.execute('''
        CREATE TABLE IF NOT EXISTS transactions (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            tx_id TEXT,
            company_name TEXT,
            invoice_num TEXT,
            amount REAL,
            file_name TEXT,
            file_hash TEXT,
            tss_score REAL,
            w1_env REAL,
            w2_cred REAL,
            w3_imp REAL,
            rate_discount TEXT,
            status TEXT
        )
    ''')
    
    # 檢查是否已有歷史數據，若無則自動注入 3 筆示範模擬資料
    cursor.execute("SELECT COUNT(*) FROM transactions")
    if cursor.fetchone()[0] == 0:
        demo_data = [
            ("TX-20261008-A101", "台灣中鋼構股份有限公司", "XX-88291034", 5250000.0, "再生鋼材採購單據.pdf", "8f3a9921b7c0d91c2e4f5a6b7c8d9e0f", 88.0, 45.0, 28.0, 15.0, "-0.35%", "Verified"),
            ("TX-20261005-B204", "台塑低碳水泥事業部", "YY-77120988", 1800000.0, "綠色水泥出貨單.pdf", "4a2b8c9d0e1f2a3b4c5d6e7f8a9b0c1d", 75.0, 45.0, 28.0, 12.0, "-0.15%", "Verified"),
            ("TX-20260928-C309", "東和鋼鐵企業股份有限公司", "ZZ-66543210", 8200000.0, "廢鋼回收再利用發票.pdf", "1f2e3d4c5b6a79887766554433221100", 88.0, 45.0, 28.0, 15.0, "-0.35%", "Verified")
        ]
        cursor.executemany('''
            INSERT INTO transactions 
            (tx_id, company_name, invoice_num, amount, file_name, file_hash, tss_score, w1_env, w2_cred, w3_imp, rate_discount, status)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        ''', demo_data)
        print("已成功自動注入 3 筆 Demo 歷史模擬數據！")

    conn.commit()
    conn.close()
