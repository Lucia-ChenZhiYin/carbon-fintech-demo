<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單筆交易資料進件介面 - 碳個究竟</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-6 text-slate-800">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 頂部導覽列與標題 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-xs font-semibold">圖 2-1 畫面預覽</span>
          <span class="text-xs text-slate-400">階段一：交易資料解析與防偽驗證</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 mt-1">單筆交易資料上傳與 AI 解析驗證</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium">企業帳號：台灣中鋼構股份公司</span>
        <button class="text-sm bg-slate-900 text-white px-4 py-2 rounded-xl hover:bg-slate-800 transition">歷史上傳紀錄</button>
      </div>
    </div>

    <!-- 主要兩欄佈局 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <form action="/process_upload" method="POST" enctype="multipart/form-data" class="lg:col-span-12 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 左側：單據檔案上傳區塊 (保留原本的外框與標題) -->
        <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
          <div>
            <!-- 標題保留 -->
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i> 單據檔案上傳
            </h2>

            <!-- 中間的拖曳上傳卡片區 -->
            <div class="border-2 border-dashed border-slate-200 rounded-xl p-8 text-center hover:border-emerald-500 transition cursor-pointer bg-slate-50/50">
              <i class="fa-solid fa-file-invoice text-4xl text-slate-300 mb-3"></i>
              <p class="text-sm font-semibold text-slate-700">拖曳發票或單據 PDF 至此</p>
              <p class="text-xs text-slate-400 mt-1 mb-4">支援格式：PDF, PNG, JPG (上限 10MB)</p>

              <!-- 👇 把那 3 行放在這裡！讓它變成一個好看的按鈕＋顯示檔名 👇 -->
              <input type="file" name="document_file" id="fileInput" class="hidden" onchange="document.getElementById('fileNameDisplay').innerText = this.files[0] ? this.files[0].name : '未選擇檔案'">
              
              <label for="fileInput" class="cursor-pointer px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-700 inline-block transition">
                選擇檔案上傳
              </label>
              
              <div class="mt-3">
                <span id="fileNameDisplay" class="text-xs font-semibold text-emerald-600">尚未選擇檔案</span>
              </div>
              <!-- 👆 放置結束 👆 -->
            </div>
          </div>

          <!-- 下方的小提示保留 -->
          <div class="mt-4 p-3 bg-emerald-50 rounded-xl flex items-start gap-2">
            <i class="fa-solid fa-shield-check text-emerald-600 text-sm mt-0.5"></i>
            <p class="text-xs text-emerald-800">上傳後系統將自動計算 SHA-256 哈希值進行跨行防重複融資驗證。</p>
          </div>
        </div>

        <!-- 右側：資料確認與初審欄位 -->
        <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
          <div>
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-emerald-600"></i> 單據 AI 辨識與資料確認
            </h2>

            <div class="space-y-4">
              
              <!-- 1. 企業名稱輸入框 -->
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">申請企業名稱</label>
                <input 
                  type="text" 
                  name="company_name" 
                  value="台灣中鋼構股份有限公司" 
                  class="w-full text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-500 focus:bg-white transition"
                  required
                >
              </div>

              <!-- 2. 發票號碼輸入框 -->
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">發票 / 單據號碼</label>
                <input 
                  type="text" 
                  name="invoice_num" 
                  value="XX-88291034" 
                  class="w-full text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-500 focus:bg-white transition"
                  required
                >
              </div>

              <!-- 3. 交易金額輸入框 -->
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">交易金額 (NT$)</label>
                <input 
                  type="number" 
                  name="amount" 
                  value="5250000" 
                  class="w-full text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-500 focus:bg-white transition"
                  required
                >
              </div>

            </div>
          </div>

          <!-- 底部按鈕 -->
          <div class="mt-6 flex justify-end">
            <button type="submit" class="px-6 py-2.5 text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-2">
              <span>確認無誤，產出 TSS 初審評估報告</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </form>
</body>
</html>
